<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Nine memory-training games based on the techniques in Moonwalking with Einstein: memory palace, names and faces, the Major System, speed cards and more.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Memory Palace Gym</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout concept: the home page is the floor plan of a memory palace — each room is one drill, numbered in the order you should walk it. Inside a room, a narrow work column with a stone-tablet panel. */
:root{
  --paper:#ECEEF2; --paper-2:#E0E4EC; --card:#F9FAFC; --ink:#172033; --ink-2:#4B5569; --line:#C3CAD7; --wall:#26304A;
  --lapis:#2944C7; --lapis-ink:#ffffff; --lapis-soft:#DDE3FA; --ochre:#A86E0C; --ochre-soft:#F5E7CC;
  --good:#1D7A4C; --good-soft:#D9F0E3; --bad:#B4232F; --bad-soft:#F8DEE0;
  --suit-red:#C0262D; --suit-black:#172033;
  --f-display:"Cinzel","Trajan Pro",Georgia,serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1320; --paper-2:#151C2D; --card:#1A2234; --ink:#E6EAF2; --ink-2:#9CA7BC; --line:#2E3953; --wall:#8B9AC0;
  --lapis:#8098FF; --lapis-ink:#0E1320; --lapis-soft:#1F2B55; --ochre:#E5AA45; --ochre-soft:#3A2D14;
  --good:#52C890; --good-soft:#15362A; --bad:#FF7A82; --bad-soft:#3E1C22;
  --suit-red:#FF7171; --suit-black:#E6EAF2; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1320; --paper-2:#151C2D; --card:#1A2234; --ink:#E6EAF2; --ink-2:#9CA7BC; --line:#2E3953; --wall:#8B9AC0;
  --lapis:#8098FF; --lapis-ink:#0E1320; --lapis-soft:#1F2B55; --ochre:#E5AA45; --ochre-soft:#3A2D14;
  --good:#52C890; --good-soft:#15362A; --bad:#FF7A82; --bad-soft:#3E1C22;
  --suit-red:#FF7171; --suit-black:#E6EAF2; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:var(--lapis)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.02em;text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lapis);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.05rem;letter-spacing:.08em;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px;margin-right:auto}
.brand svg{flex:none}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{font-size:.85rem;font-weight:500;text-decoration:none;color:var(--ink-2);padding:6px 10px;border-radius:var(--r)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--paper)}
.nav a:hover{color:var(--ink)}
.sync{font-size:.72rem;color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase}

.wrap{max-width:1080px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.narrow{max-width:760px;margin:0 auto}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ochre)}
.lede{font-size:1.08rem;color:var(--ink-2);max-width:62ch}
.muted{color:var(--ink-2)}
.small{font-size:.85rem}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;align-items:end;margin-bottom:28px}
.hero h1{font-size:clamp(2rem,5vw,3.3rem)}
.hero .quote{border-left:3px solid var(--ochre);padding:4px 0 4px 16px;font-style:italic;color:var(--ink-2)}
.hero .quote b{display:block;font-style:normal;font-size:.8rem;font-weight:500;margin-top:6px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}

/* floor plan */
.plan{border:4px solid var(--wall);background:var(--card);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:minmax(150px,auto);position:relative;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px}
.room{position:relative;border:2px solid var(--wall);margin:-1px;padding:14px 14px 12px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:6px;background:color-mix(in srgb,var(--card) 88%,transparent);transition:background .15s}
.room:hover{background:var(--lapis-soft)}
.room::after{content:"";position:absolute;background:var(--card);}
.room.door-b::after{left:24px;bottom:-3px;width:34px;height:4px}
.room.door-r::after{right:-3px;top:26px;width:4px;height:34px}
.room:hover::after{background:var(--lapis-soft)}
.room .num{font-family:var(--f-mono);font-size:.72rem;color:var(--ochre);font-weight:600;letter-spacing:.06em}
.room h3{font-size:1.06rem}
.room .tech{font-size:.82rem;color:var(--ink-2);line-height:1.4}
.room .best{margin-top:auto;font-size:.75rem;font-family:var(--f-mono);color:var(--ink-2)}
.room .best b{color:var(--lapis)}
.room.big h3{font-size:1.3rem}
.r-palace{grid-column:span 3;grid-row:span 2}
.r-pictures{grid-column:span 3}.r-digits{grid-column:span 3}
.r-faces{grid-column:span 3}.r-major{grid-column:span 3}.r-cards{grid-column:span 2}
.r-tea{grid-column:span 2}.r-poem{grid-column:span 2}.r-forge{grid-column:span 6;min-height:110px}
.compass{position:absolute;right:10px;bottom:-34px;font-family:var(--f-mono);font-size:.7rem;color:var(--ink-2)}
@media (max-width:820px){.plan{grid-template-columns:repeat(2,minmax(0,1fr))}.r-palace{grid-column:span 2;grid-row:auto}.r-pictures,.r-digits,.r-faces,.r-major,.r-cards,.r-tea,.r-poem,.r-forge{grid-column:span 1}}
@media (max-width:480px){.plan{grid-template-columns:1fr}.r-palace{grid-column:span 1}.room{min-height:120px}}

.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:52px}
.strip > div{border-top:2px solid var(--ink);padding-top:12px}
.strip h3{font-size:.95rem;margin-bottom:6px}
.strip p{font-size:.9rem;color:var(--ink-2)}
@media (max-width:760px){.strip{grid-template-columns:1fr}}

/* game chrome */
.ghead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
.ghead h1{font-size:clamp(1.6rem,4vw,2.3rem)}
.ghead .back{font-size:.85rem;text-decoration:none;color:var(--ink-2)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.panel.tablet{border-top:4px solid var(--ink)}
.tip{background:var(--ochre-soft);border-radius:var(--r);padding:12px 14px;font-size:.92rem}
.tip b{font-weight:600}
.tip .lbl{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--ochre);display:block;margin-bottom:2px}
.btn{appearance:none;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:9px 16px;border-radius:var(--r);font-weight:500;cursor:pointer;line-height:1.2;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--paper-2)}
.btn.primary{background:var(--lapis);border-color:var(--lapis);color:var(--lapis-ink)}
.btn.primary:hover{filter:brightness(1.08);background:var(--lapis)}
.btn.ghost{border-color:transparent;color:var(--ink-2)}
.btn.small{padding:6px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:.88rem;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:500;color:var(--ink-2)}
input[type=text],input[type=number],textarea,select{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;width:100%;min-width:0}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--lapis);outline:none;box-shadow:0 0 0 3px var(--lapis-soft)}
textarea{resize:vertical;line-height:1.5}
.optrow{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end}
.optrow > *{min-width:0}

.clock{font-family:var(--f-mono);font-size:1.05rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.progress{height:4px;background:var(--paper-2);border-radius:2px;overflow:hidden}
.progress > i{display:block;height:100%;background:var(--lapis);width:0;transition:width .2s}

.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score .big{font-family:var(--f-display);font-size:3rem;font-weight:700;line-height:1}
.score .of{font-family:var(--f-mono);color:var(--ink-2)}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--paper-2);color:var(--ink-2);letter-spacing:.03em}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.ok{color:var(--good)} .no{color:var(--bad)}
.input-ok{border-color:var(--good)!important;background:var(--good-soft)!important}
.input-no{border-color:var(--bad)!important;background:var(--bad-soft)!important}

/* palace walk */
.stage{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px 10px}
.locus{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ochre);font-weight:600}
.item-big{font-family:var(--f-display);font-size:clamp(1.9rem,6vw,3rem);font-weight:700;overflow-wrap:anywhere}
.recall-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.recall-cell{display:flex;flex-direction:column;gap:4px}
.recall-cell span{font-size:.75rem;color:var(--ink-2)}
.recall-cell .ans{font-size:.78rem;min-height:1em}

/* pictures */
.pic-stage{font-size:clamp(5rem,22vw,9rem);line-height:1;height:1.3em;display:flex;align-items:center;justify-content:center;user-select:none}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:440px;margin:0 auto}
.pair button{font-size:clamp(3.5rem,14vw,5.5rem);line-height:1;padding:22px 0;background:var(--paper);border:2px solid var(--line);border-radius:var(--r);cursor:pointer}
.pair button:hover{border-color:var(--lapis)}

/* digits */
.digit-show{font-family:var(--f-mono);font-size:clamp(3.5rem,16vw,6rem);font-weight:600;height:1.2em;display:flex;align-items:center;justify-content:center}
.big-input{font-family:var(--f-mono);font-size:1.6rem!important;letter-spacing:.12em;text-align:center}

/* faces */
.face-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.face-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.face-card svg{width:100%;height:auto;display:block;border-radius:4px}
.face-name{text-align:center;font-weight:600;line-height:1.25}
.face-card input{padding:6px 8px;font-size:.9rem}
.face-card .ans{font-size:.78rem;text-align:center}

/* major */
.major-table{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.major-table div{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:center}
.major-table b{display:block;font-family:var(--f-mono);font-size:1.6rem}
.major-table span{font-weight:600;color:var(--lapis)}
.major-table small{display:block;color:var(--ink-2);font-size:.72rem;line-height:1.3;margin-top:4px}
@media (max-width:560px){.major-table{grid-template-columns:repeat(2,minmax(0,1fr))}}
.peg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.peg-grid label{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.85rem;color:var(--ink-2)}
.peg-grid input{padding:5px 7px;font-family:var(--f-body);font-size:.88rem}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:460px;margin:0 auto;width:100%}
.choices button{padding:14px;font-size:1.1rem;border:1px solid var(--line);background:var(--paper);border-radius:var(--r);cursor:pointer}
.choices button:hover{border-color:var(--lapis)}
.digits-pairs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.digits-pairs span{font-family:var(--f-mono);font-size:1.6rem;font-weight:600;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:4px 8px;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.digits-pairs span small{font-family:var(--f-body);font-size:.7rem;font-weight:500;color:var(--ink-2)}

/* cards */
.pcard{width:120px;aspect-ratio:5/7;max-width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 0 var(--line);display:flex;flex-direction:column;justify-content:space-between;padding:8px 10px;font-family:var(--f-mono);font-weight:600;user-select:none}
.pcard.red{color:var(--suit-red)} .pcard.black{color:var(--suit-black)}
.pcard .c{font-size:3.2rem;text-align:center;line-height:1}
.pcard .t{font-size:1.25rem;line-height:1}
.pcard .bt{font-size:1.25rem;line-height:1;transform:rotate(180deg)}
.pcard.lg{width:min(180px,40vw)}
.pcard.lg .c{font-size:4.4rem}
.card-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.pao-hint{font-size:.9rem;color:var(--ink-2);min-height:1.5em}
.pick-grid{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:4px}
.pick-grid button{font-family:var(--f-mono);font-weight:600;font-size:.82rem;padding:8px 0;border:1px solid var(--line);border-radius:4px;background:var(--card);cursor:pointer}
.pick-grid button.red{color:var(--suit-red)}
.pick-grid button:disabled{opacity:.2;cursor:default}
@media (max-width:640px){.pick-grid{grid-template-columns:repeat(7,minmax(0,1fr))}}
.seq{display:flex;flex-wrap:wrap;gap:4px;min-height:34px;padding:6px;border:1px dashed var(--line);border-radius:var(--r)}
.seq span{font-family:var(--f-mono);font-weight:600;font-size:.82rem;padding:3px 6px;border-radius:4px;background:var(--paper-2)}
.seq span.red{color:var(--suit-red)}
.seq span.good{background:var(--good-soft)} .seq span.bad{background:var(--bad-soft);text-decoration:line-through}
.pao-table{width:100%;border-collapse:collapse;font-size:.88rem}
.pao-table th{text-align:left;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);padding:6px 4px;border-bottom:1px solid var(--line)}
.pao-table td{padding:3px 4px;border-bottom:1px solid var(--line)}
.pao-table td:first-child{font-family:var(--f-mono);font-weight:600;white-space:nowrap}
.pao-table input{padding:5px 7px;font-size:.86rem}
.scroll-x{overflow-x:auto}

/* tea party */
.guest{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:.95rem}
.guest dt{color:var(--ink-2);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.guest dd{margin:0;font-weight:500}
.rooms-key{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;font-size:.82rem}
.rooms-key div{border:1px solid var(--line);border-radius:4px;padding:6px 8px;background:var(--paper)}
.rooms-key b{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ochre)}
.strikes{font-family:var(--f-mono);font-size:1.3rem;color:var(--bad);letter-spacing:.2em}

/* poem */
.poem{font-family:Georgia,"Times New Roman",serif;font-size:1.12rem;line-height:1.75;white-space:pre-wrap}
.poem-line{display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:8px;align-items:start;padding:6px 0;border-bottom:1px solid var(--line)}
.poem-line .n{font-family:var(--f-mono);font-size:.75rem;color:var(--ink-2);padding-top:6px}
.poem-line .txt{font-family:Georgia,serif;font-size:1.06rem}
.poem-line textarea,.poem-line input{font-size:.92rem}
.diff ins{text-decoration:none;background:var(--good-soft);color:var(--good)}
.diff del{background:var(--bad-soft);color:var(--bad)}

/* forge */
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.checks label{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;cursor:pointer;background:var(--paper)}
.checks input{margin-top:4px}

/* learn */
.tech-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:8px}
.tcard h3{font-size:1.1rem}
.tcard ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px;font-size:.93rem}
.tcard .try{margin-top:auto;padding-top:6px}
@media (max-width:760px){.tech-list{grid-template-columns:1fr}}

/* log */
.log-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.log-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.log-card h3{font-size:1rem}
.log-card .stats{display:flex;gap:16px;font-size:.8rem;color:var(--ink-2)}
.log-card .stats b{display:block;font-family:var(--f-mono);font-size:1.15rem;color:var(--ink)}
.spark{width:100%;height:56px;display:block}
.today{display:flex;gap:22px;flex-wrap:wrap}
.today div b{display:block;font-family:var(--f-display);font-size:2rem;line-height:1.1}
.today div span{font-size:.8rem;color:var(--ink-2)}
.hist{width:100%;border-collapse:collapse;font-size:.86rem}
.hist td,.hist th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.hist th{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.hist td.num{font-family:var(--f-mono);text-align:right}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* explainers */
.guide{background:var(--paper-2);border-radius:var(--r);padding:14px 18px;margin-bottom:18px}
.guide summary{cursor:pointer;font-weight:600}
.guide-in{display:flex;flex-direction:column;gap:14px;margin-top:10px}
.guide-in > p{max-width:72ch}
.guide-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.guide h3,.intro h3.k{font-family:var(--f-body);font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ochre);margin-bottom:6px}
.guide ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:5px}
@media (max-width:700px){.guide-cols{grid-template-columns:1fr}}
.intro{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--ink);border-radius:var(--r);padding:22px;margin-bottom:34px;display:flex;flex-direction:column;gap:18px}
.intro h2{font-size:1.5rem}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;counter-reset:st}
.steps li{display:flex;flex-direction:column;gap:6px;counter-increment:st}
.steps li::before{content:counter(st);font-family:var(--f-display);font-weight:700;font-size:1.6rem;color:var(--lapis);line-height:1}
.steps b{font-size:1.02rem}
.steps p{font-size:.93rem;color:var(--ink-2)}
@media (max-width:760px){.steps{grid-template-columns:1fr}}
.try-now{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--ochre-soft);border-radius:var(--r);padding:12px 14px}
.try-now p{flex:1;min-width:240px;font-size:.93rem}
.plan-cap{font-size:.88rem;color:var(--ink-2);margin:0 0 10px}
.gloss{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 28px;margin:0}
.gloss div{padding:9px 0;border-bottom:1px solid var(--line)}
.gloss dt{font-weight:600}
.gloss dd{margin:2px 0 0;color:var(--ink-2);font-size:.92rem}
@media (max-width:700px){.gloss{grid-template-columns:1fr}}
.tcard .what{color:var(--ink-2);font-size:.93rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<header class="bar"><div class="bar-in">
  <a class="brand" href="#home"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M2 20V8l9-6 9 6v12z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 20v-6h3v6M13 11h3v3h-3z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>Memory Palace Gym</a>
  <nav class="nav" aria-label="Main">

    <a href="#log" data-nav="log">Training log</a>
  </nav>
  <span class="sync" id="sync">Saved on this device</span>
</div></header>
<main class="wrap" id="app"></main>
<script>
/* ============ helpers ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k === 'value') e.value = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
const rand = n => Math.floor(Math.random() * n);
const pick = a => a[rand(a.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const sample = (a, n) => shuffle(a).slice(0, n);
const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9\s]/g, '').replace(/\s+/g, ' ').trim();
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
/* forgiving match: case, punctuation, a trailing plural, one typo on longer words */
function matches(given, answer) {
  const g = norm(given), a = norm(answer);
  if (!g) return false;
  if (g === a) return true;
  const strip = s => s.replace(/(es|s)$/, '');
  if (strip(g) === strip(a)) return true;
  return a.length >= 5 && lev(g, a) <= 1;
}
const fmtTime = ms => { const s = Math.max(0, ms) / 1000; const m = Math.floor(s / 60); return m ? `${m}:${(s % 60).toFixed(1).padStart(4, '0')}` : `${s.toFixed(1)}s`; };
function stopwatch(elm) {
  const t0 = performance.now(); let id = 0;
  const tick = () => { elm.textContent = fmtTime(performance.now() - t0); id = requestAnimationFrame(tick); };
  tick();
  return { stop() { cancelAnimationFrame(id); return performance.now() - t0; }, elapsed: () => performance.now() - t0 };
}
function countdown(elm, secs, onDone) {
  const end = performance.now() + secs * 1000; let id = 0, done = false;
  const tick = () => {
    const left = end - performance.now();
    elm.textContent = fmtTime(left);
    if (left <= 0) { if (!done) { done = true; onDone && onDone(); } return; }
    id = requestAnimationFrame(tick);
  };
  tick();
  return { stop() { done = true; cancelAnimationFrame(id); return secs * 1000 - Math.max(0, end - performance.now()); } };
}
function seg(options, value, onChange) {
  const wrap = h('div', { class: 'seg', role: 'group' });
  const btns = options.map(([v, label]) => h('button', { type: 'button', 'aria-pressed': String(v === value), onclick: () => { btns.forEach(b => b.setAttribute('aria-pressed', 'false')); btn(v).setAttribute('aria-pressed', 'true'); onChange(v); } }, label));
  const btn = v => btns[options.findIndex(o => o[0] === v)];
  wrap.append(...btns); return wrap;
}
function tip(label, ...body) { return h('div', { class: 'tip' }, h('span', { class: 'lbl' }, label), ...body); }

/* cleanup registry for timers/listeners of the current view */
let cleanups = [];
const onLeave = fn => cleanups.push(fn);
function runCleanups() { cleanups.forEach(f => { try { f(); } catch (e) {} }); cleanups = []; }
function later(fn, ms) { const id = setTimeout(fn, ms); onLeave(() => clearTimeout(id)); return id; }
function onKey(fn) { document.addEventListener('keydown', fn); onLeave(() => document.removeEventListener('keydown', fn)); }

/* ============ storage: private per-viewer doc when signed in, else this browser ============ */
const LS_KEY = 'mpg-training-v1';
const Store = {
  data: { sessions: [], loci: null, pao: null, pegs: null },
  ref: null, writing: false, again: false, mode: 'local',
  loadLocal() { try { const s = localStorage.getItem(LS_KEY); if (s) Object.assign(this.data, JSON.parse(s)); } catch (e) {} },
  saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(this.data)); } catch (e) {} },
  merge(remote) {
    const seen = new Set(); const all = [];
    for (const s of [...(remote.sessions || []), ...this.data.sessions]) { const k = s.id || (s.t + s.g); if (!seen.has(k)) { seen.add(k); all.push(s); } }
    all.sort((a, b) => a.t - b.t);
    this.data.sessions = all.slice(-600);
    for (const k of ['loci', 'pao', 'pegs']) if (remote[k] && !this.data[k]) this.data[k] = remote[k]; else if (remote[k] && this.data[k]) this.data[k] = remote[k];
  },
  async connect() {
    try {
      if (!window.claude || !window.claude.use) return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      this.ref = db.doc('data/users/' + id + '/training');
      const snap = await Promise.race([this.ref.get(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 10000))]);
      const had = this.data.sessions.length;
      if (snap.exists) this.merge(snap.data() || {});
      this.mode = 'cloud'; setSync();
      if (!snap.exists || had) this.flush();
      this.saveLocal();
      if (['home', 'log'].includes(currentView)) route();
    } catch (e) { this.ref = null; this.mode = 'local'; setSync(); }
  },
  save() { this.saveLocal(); if (this.ref) this.flush(); },
  async flush() {
    if (this.writing) { this.again = true; return; }
    this.writing = true;
    try { await this.ref.set(JSON.parse(JSON.stringify(this.data))); this.mode = 'cloud'; }
    catch (e) { this.mode = 'local'; }
    setSync();
    this.writing = false;
    if (this.again) { this.again = false; this.flush(); }
  },
  record(g, score, max, extra = {}) {
    const s = { id: Date.now().toString(36) + rand(1e6).toString(36), g, score, max, t: Date.now(), ...extra };
    this.data.sessions.push(s);
    if (this.data.sessions.length > 600) this.data.sessions = this.data.sessions.slice(-600);
    this.save();
    return s;
  },
  best(g) { const ss = this.data.sessions.filter(s => s.g === g); return ss.length ? ss.reduce((a, b) => (GAMES[g].better(b, a) ? b : a)) : null; },
};
function setSync() { const e = $('#sync'); if (e) e.textContent = Store.mode === 'cloud' ? 'Saved to your account' : 'Saved on this device'; }

/* ============ catalogue of drills (walking order = suggested progression) ============ */
const pct = s => s.max ? s.score / s.max : 0;
const higherPct = (a, b) => pct(a) > pct(b) || (pct(a) === pct(b) && (a.ms || 1e12) < (b.ms || 1e12));
const GAMES = {
  pictures: { n: 1, name: 'Picture Recall', tech: 'A two-minute warm-up: find out how many pictures you remember without even trying.', cls: 'r-pictures door-b', better: higherPct, fmt: s => `${s.score}/${s.max}` },
  digits: { n: 2, name: 'Digit Span', tech: 'How many digits can you hold at once? Learn to beat the usual limit of about seven.', cls: 'r-digits door-b', better: (a, b) => a.score > b.score, fmt: s => `${s.score} digits` },
  palace: { n: 3, name: 'The Palace Walk', tech: 'The main technique. Remember a list by picturing each item at a spot along a route through a house you know.', cls: 'r-palace big door-r', better: higherPct, fmt: s => `${s.score}/${s.max}` },
  faces: { n: 4, name: 'Names & Faces', tech: 'Remember names by turning each one into a picture and linking it to something noticeable about the face.', cls: 'r-faces door-b', better: higherPct, fmt: s => `${s.score}/${s.max}` },
  major: { n: 5, name: 'Major System', tech: 'A code that turns numbers into words, so you can picture them. Great for PINs and phone numbers.', cls: 'r-major door-b', better: higherPct, fmt: s => `${s.score}/${s.max}` },
  cards: { n: 6, name: 'Speed Cards', tech: 'Memorise a shuffled deck the way competitors do: every three cards become one scene.', cls: 'r-cards door-b', better: (a, b) => (a.score === a.max ? 1 : 0) * 1e9 + a.max * 1e3 - (a.ms || 0) / 1e3 > (b.score === b.max ? 1 : 0) * 1e9 + b.max * 1e3 - (b.ms || 0) / 1e3, fmt: s => s.score === s.max ? `${s.max} cards · ${fmtTime(s.ms)}` : `${s.score}/${s.max}` },
  tea: { n: 7, name: 'The Tea Party', tech: 'Remember facts about new people: birthdays, phone numbers, pets, hobbies.', cls: 'r-tea', better: higherPct, fmt: s => `${s.score}/${s.max}` },
  poem: { n: 8, name: 'Poem by Heart', tech: 'Learn a poem word for word, with a picture or a feeling for each line.', cls: 'r-poem', better: higherPct, fmt: s => `${Math.round(pct(s) * 100)}% words` },
  forge: { n: 9, name: 'Image Forge', tech: 'Practise the skill behind everything else: turning dull or abstract words into vivid pictures.', cls: 'r-forge', better: (a, b) => a.score > b.score, fmt: s => `${s.score} images` },
};


/* ============ plain-language explainers, one per room ============ */
const GUIDES = {
  pictures: { what: 'Your brain is remarkably good at remembering pictures and poor at remembering words and numbers. This warm-up shows you how strong your picture memory already is. Every other room uses this strength.', how: ['Pictures flash up one at a time.', 'Just look at each one properly. No tricks needed.', 'Then you see two pictures at a time. Tap the one you saw.'], example: 'Most people get 25 or more out of 30 on their first try, even though each picture was on screen for only a second.' },
  digits: { what: 'Your short-term memory holds only about seven things at once, which is why phone numbers are split into groups. “Chunking” means grouping small items into bigger, meaningful ones, so each of those seven slots holds more. This test measures your “digit span”: how many digits you can repeat back.', how: ['Digits appear one at a time.', 'Type them back in the same order.', 'Each correct answer adds one digit. Two misses at the same length ends the test, and your best length is your span.'], example: '1 9 6 9 2 0 0 1 is eight digits to juggle. Seen as two years, 1969 and 2001, it is just two chunks.' },
  palace: { what: 'A memory palace is a place you know well (your home, your school, your walk to work) used as a mental filing system. You choose a fixed route with stops along it. To remember a list, you picture each item, in an exaggerated or ridiculous way, at the next stop. To recall, you walk the route in your mind and see what is waiting at each stop. The technique is about 2,500 years old, and it is still what memory champions use.', how: ['Set up your palace below: 10–25 stops in walking order through a place you know. Or use the example house.', 'Each item appears with its stop. Close your eyes and see the item at that spot, as vividly and strangely as you can.', 'Then walk the route again in your mind and type what you find at each stop.'], example: 'List: milk, batteries, stamps. Front door: milk gushing out of the letterbox and soaking your shoes. Sofa: batteries fizzing between the cushions, smelling of burnt plastic. Kitchen table: a giant stamp licking you.' },
  faces: { what: 'Names are hard to remember because a name on its own means nothing. Psychologists call this the Baker/baker paradox: tell people a man is a baker and they remember it; tell them his name is Baker and they forget, even though it is the same word. A job comes with pictures (bread, a white hat). A name has none until you give it one.', how: ['Pick one feature of each face that stands out: glasses, a beard, curly hair.', 'Turn the name into a picture: Baker → a baker, Kowalski → a cow on skis. Sound-alikes are fine.', 'Imagine the picture doing something to that feature.', 'Then the faces come back in a new order and you type their names.'], example: 'Ben Fisher, who wears round glasses: a fish flops out of each lens while Big Ben chimes on top of his head.' },
  major: { what: 'Numbers are abstract, so they are hard to picture. The Major System is a code that gives each digit a consonant sound. You add any vowels you like to make a word, and a word is something you can picture.', how: ['Learn the ten sounds in the table below. The memory aid under each one helps.', 'Practise until a picture comes to mind the moment you see a number.', 'For long numbers, split them into pairs and place each pair’s picture at a stop in your palace, or link them into a silly story.'], example: '86 → f + sh → fish. 40 → r + s → rose. So 8640 becomes a fish carrying a rose in its mouth.' },
  cards: { what: 'Memory competitors memorise a shuffled deck by giving each of the 52 cards a person, an action and an object (PAO for short). Three cards then become one scene: the first card’s person doing the second card’s action to the third card’s object. A whole deck fits into 18 scenes, placed along a memory palace.', how: ['Look at the starter images in “Edit your PAO deck” at the bottom, or replace them with your own. Start small, with hints on.', 'Each group of three cards appears. Picture the scene at your next palace stop.', 'Then tap the cards in the order you saw them.'], example: 'K♥, K♣, K♦ with the starter deck: the King (person of K♥) whistling (action of K♣) a cigar (object of K♦). A king blowing a cigar like a whistle at your front door.' },
  tea: { what: 'This room combines everything. Give each guest their own imaginary house, and always keep the same kind of fact in the same room (birthdays always in the bathroom, phone numbers always in the den), so you know where to look. Use the Major System from Room 5 for numbers and pictures for everything else.', how: ['Read each guest’s details and build a scene for each fact in the matching room (see the list of rooms).', 'Then answer questions about the guests, one at a time.', 'In three-strikes mode, three wrong answers end the game.'], example: 'Born 12/22/67: in the bathroom of that guest’s house, a tuna (12) wrestles a nun (22) who is eating a chick (67).' },
  poem: { what: 'Learning a poem word for word is the hardest kind of memorising, because many words (“the”, “and”, “hope”) are hard to picture. There are two approaches: picture each line at a stop in your palace, or attach a feeling to each line, the way actors learn scripts. Rhythm and rhyme help too.', how: ['Pick a poem. Read each line aloud two or three times.', 'Write a short picture or feeling for each line. Each one goes at a stop in your palace.', 'Practise with only the first letter of each word showing.', 'Type the poem from memory. You score a point for each correct word.'], example: '“Who has seen the wind?” → at your front door, a faceless ghost asks you exactly that while your hair whips about.' },
  forge: { what: 'Everything on this site depends on one skill: turning dull or abstract things into pictures that are big, strange, moving and full of smells and sounds. Abstract words need a trick: use a sound-alike (barometer → a bar) or a concrete symbol (justice → weighing scales).', how: ['You get a word or phrase.', 'Write the scene you would picture.', 'Tick the qualities your scene has, then compare it with an example.'], example: '“Patience” sounds like “patients”: a doctor’s waiting room full of tortoises, each one knitting very, very slowly.' },
};

/* ============ router ============ */
const VIEWS = {};
let currentView = 'home';
function route() {
  runCleanups();
  let v = (location.hash || '#home').slice(1);
  if (!VIEWS[v]) v = 'home';
  currentView = v;
  $$('[data-nav]').forEach(a => a.toggleAttribute('aria-current', false));
  const navKey = GAMES[v] ? 'home' : v;
  const navEl = $(`[data-nav="${navKey}"]`); if (navEl) navEl.setAttribute('aria-current', 'page');
  const app = $('#app'); app.innerHTML = '';
  VIEWS[v](app);
  window.scrollTo(0, 0);
}
function gameHeader(key, sub) {
  const g = GAMES[key]; const b = Store.best(key); const G = GUIDES[key];
  const head = h('div', { class: 'ghead' },
    h('div', { class: 'stack', style: 'gap:6px;flex:1;min-width:0' },
      h('a', { class: 'back', href: '#home' }, '← Back to the palace'),
      h('span', { class: 'eyebrow' }, `Room ${g.n}`),
      h('h1', {}, g.name),
      sub ? h('p', { class: 'lede' }, sub) : null),
    b ? h('span', { class: 'pill' }, 'Your best: ' + g.fmt(b)) : null);
  const frag = document.createDocumentFragment(); frag.append(head);
  if (G) {
    let open = true; try { open = localStorage.getItem('mpg-guide-' + key) !== 'closed'; } catch (e) {}
    const det = h('details', { class: 'guide', open },
      h('summary', {}, 'How it works'),
      h('div', { class: 'guide-in' }, h('p', {}, G.what),
        h('div', { class: 'guide-cols' },
          h('div', {}, h('h3', {}, 'How to play'), h('ol', {}, G.how.map(x => h('li', {}, x)))),
          h('div', {}, h('h3', {}, 'Example'), h('p', {}, G.example)))));
    det.addEventListener('toggle', () => { try { localStorage.setItem('mpg-guide-' + key, det.open ? 'open' : 'closed'); } catch (e) {} });
    frag.append(det);
  }
  return frag;
}

/* ============ home ============ */
VIEWS.home = app => {
  const s = Store.data.sessions;
  const today = s.filter(x => new Date(x.t).toDateString() === new Date().toDateString()).length;
  app.append(
    h('section', { class: 'hero' },
      h('div', { class: 'stack' },
        h('span', { class: 'eyebrow' }, 'Memory training games'),
        h('h1', {}, 'Walk the rooms. Fill them with strange pictures.'),
        h('p', { class: 'lede' }, 'These games teach the techniques from ', h('i', {}, 'Moonwalking with Einstein'), ', Joshua Foer’s book about how an ordinary journalist trained his memory for one year and won the 2006 U.S. Memory Championship. You don’t need to have read it: every game explains its technique before you start.')),
      h('div', { class: 'stack' },
        h('p', { class: 'quote' }, '“Even average memories are remarkably powerful if used properly.”', h('b', {}, 'Ed Cooke, memory champion and Foer’s coach')),
        h('p', { class: 'small muted' }, today ? `${today} session${today > 1 ? 's' : ''} logged today. ` : 'Nothing logged today yet. ', 'A good routine: 30 minutes a day, as Foer did.'))),
    h('section', { class: 'intro', 'aria-labelledby': 'intro-h' },
      h('div', { class: 'stack', style: 'gap:6px' }, h('span', { class: 'eyebrow' }, 'New here? Start with this'), h('h2', { id: 'intro-h' }, 'The whole method in one minute'),
        h('p', { class: 'muted', style: 'max-width:72ch' }, 'When scientists scanned the brains of memory champions, they found ordinary brains. The champions weren’t born with special memories. They use a handful of techniques that anyone can learn, built on three steps:')),
      h('ol', { class: 'steps' },
        h('li', {}, h('b', {}, 'Turn it into a picture'), h('p', {}, 'Your brain stores pictures far better than words or numbers. So don’t remember the word “milk”: picture milk gushing out of something. Make it huge, funny, gross or ridiculous. Ordinary things slip away; strange ones stick.')),
        h('li', {}, h('b', {}, 'Put it somewhere you know'), h('p', {}, 'Choose a place you know by heart, like your home, and a fixed route through it: front door, hallway, sofa, kitchen. Leave one picture at each stop. This is called a memory palace.')),
        h('li', {}, h('b', {}, 'Walk back through'), h('p', {}, 'To remember, imagine walking the route again. Each picture is waiting where you left it, in order. Walk it again later today and tomorrow, and it lasts.'))),
      h('div', { class: 'try-now' },
        h('p', {}, h('b', {}, 'Try it now: '), 'milk, batteries, stamps. Milk gushes out of your letterbox. Batteries fizz and spark between your sofa cushions. A giant stamp licks your kitchen table. Close your eyes, walk in through the front door, and see what’s there.'),
        h('a', { class: 'btn primary', href: '#palace' }, 'Try the Palace Walk'))),
    h('p', { class: 'plan-cap' }, 'The rooms are in the suggested order. Each one has a short explanation, then the game.'),
    h('nav', { class: 'plan', 'aria-label': 'Games' },
      Object.entries(GAMES).map(([k, g]) => {
        const b = Store.best(k);
        return h('a', { class: 'room ' + g.cls, href: '#' + k },
          h('span', { class: 'num' }, `ROOM ${String(g.n).padStart(2, '0')}`),
          h('h3', {}, g.name),
          h('p', { class: 'tech' }, g.tech),
          h('span', { class: 'best' }, b ? h('span', {}, 'Your best ', h('b', {}, g.fmt(b))) : 'Not yet tried'));
      })),
    h('section', { class: 'strip' },
      h('div', {}, h('h3', {}, 'Why it works'), h('p', {}, 'We evolved to remember where things are and what they look like, not lists of words or numbers. Every game turns the second kind of information into the first.')),
      h('div', {}, h('h3', {}, 'Track your progress'), h('p', {}, 'Every finished game is saved to your training log. If your scores stop improving, the log tells you and suggests how to push harder.')),
      h('div', {}, h('h3', {}, 'New words?'), h('p', {}, 'The ', h('a', { href: '#learn' }, 'Techniques page'), ' explains every term (loci, PAO, chunking) and who the people quoted in the tips are.'))));
};

/* ============ techniques ============ */
const TECHNIQUES = [
  { t: 'Turn it into a picture', go: 'forge', what: 'Also called elaborative encoding. The principle behind every other technique.', pts: ['Your memory for pictures and places is superb; for words and numbers, poor. So translate one into the other.', 'Make every picture vivid: exaggerated, moving, with smells and sounds, funny, rude or bizarre.', 'Unique beats familiar. You have seen thousands of wine bottles, so “wine” blurs together. A wine bottle that talks is one of a kind.', 'Abstract words need a stand-in: a sound-alike (barometer → a bar full of snacks) or a symbol (justice → scales).'] },
  { t: 'The memory palace', go: 'palace', what: 'Also called the method of loci (Latin for “places”). Store pictures, in order, along a route through a place you know.', pts: ['Choose a building you know intimately. Your childhood home is a classic first choice.', 'Fix a route and leave one picture at each stop. To remember, walk it again, forwards or backwards.', 'Make each picture stand out from its spot. A white egg against a white wall disappears.', 'Build several palaces and give each a job. Clear one out before reusing it.'] },
  { t: 'Review on a schedule', go: 'log', what: 'Memories fade fastest right after you learn them.', pts: ['In the 1880s, psychologist Hermann Ebbinghaus found that more than half of new material is forgotten within an hour.', 'Walk your palace again that evening, the next day, and a week later.', 'Sleep locks memories in. Missing sleep is the enemy of memory.'] },
  { t: 'Names and faces', go: 'faces', what: 'A name means nothing on its own, so give it a meaning.', pts: ['The Baker/baker paradox: people remember that a man is a baker, but forget that his name is Baker. The job comes with pictures; the name doesn’t.', 'Turn the name into something you can picture (Foer → “four”) and link it to one striking feature of the face.', 'Most names are lost because we aren’t paying attention. Decide to notice.'] },
  { t: 'Chunking', go: 'digits', what: 'Group small items into bigger, meaningful ones.', pts: ['Short-term memory holds about seven items at once. So make each item bigger.', '120741091101 is hard; as two dates, 12/07/41 and 09/11/01, it is easy.', 'Use what you already know. A runner in a famous experiment read digits as race times and remembered about 80 of them.'] },
  { t: 'The Major System', go: 'major', what: 'A code that turns digits into sounds, sounds into words, and words into pictures.', pts: ['0 s/z · 1 t/d · 2 n · 3 m · 4 r · 5 l · 6 j/sh/ch · 7 k/g · 8 f/v · 9 p/b', 'Add any vowels: 32 = man, 86 = fish, 40 = rose, 92 = pen.', 'Useful straight away for PINs, card numbers and phone numbers.'] },
  { t: 'Person–Action–Object (PAO)', go: 'cards', what: 'The system competitors use for playing cards and long numbers.', pts: ['Give every card (or every number from 00 to 99) a person, an action and an object.', 'Three items make one scene: the first one’s person, the second one’s action, the third one’s object. A deck fits in 18 scenes.', 'At speed, one vivid detail of a scene is enough. Make similar images clearly different.'] },
  { t: 'Remembering text and speeches', go: 'poem', what: 'Decide whether you need the gist or the exact words.', pts: ['For a speech: one picture per point, each at a stop in your palace. (The phrase “in the first place” comes from this.)', 'For exact words: say a line two or three times, then turn it into pictures.', 'Or attach a feeling to each short chunk, as actors do. Acting it out helps too.', 'Rhyme, rhythm, repetition and song make words stick. That is why we learn the alphabet as a song.'] },
  { t: 'Organising facts', go: 'tea', what: 'For many facts about many things, give each its own palace with the same layout.', pts: ['One house per person or topic.', 'Same room, same kind of fact: kitchen for addresses, den for phone numbers, bathroom for birthdays.', 'When there is too much, decide on purpose what to skip, and get the rest right.'] },
  { t: 'Breaking through plateaus', go: 'log', what: 'How experts keep improving when most people stall.', pts: ['Once a skill feels “good enough” it goes on autopilot and stops improving. The book calls this the OK plateau.', 'Deliberate practice: focus on technique, set goals, get instant feedback, and practise the parts you fail at.', 'Push 10–20% faster than is comfortable (a metronome works for cards). Keep notes on what goes wrong.', 'Expect to do about 20% worse under pressure than in practice.'] },
  { t: 'Attention and a richer life', go: null, what: 'Remembering starts with noticing.', pts: ['“Remembering can only happen if you decide to take notice.”', 'Routine makes the years blur together; new experiences make them feel longer. Change your routine and create landmarks.', 'Memory is like a spiderweb: the more it catches, the more it can catch. Learning the basics of a subject makes the rest easier.'] },

function sparkline(vals) {
  const W = 240, H = 56, P = 6;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('class', 'spark'); svg.setAttribute('preserveAspectRatio', 'none');
  if (vals.length < 2) return svg;
  const lo = 0, hi = Math.max(1, ...vals);
  const x = i => P + i * (W - 2 * P) / (vals.length - 1), y = v => H - P - (v - lo) / (hi - lo) * (H - 2 * P);
  const d = vals.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  svg.innerHTML = `<path d="M${P},${H - P}H${W - P}" stroke="var(--line)" stroke-width="1" fill="none"/>
    <path d="${d}L${x(vals.length - 1)},${H - P}L${P},${H - P}Z" fill="var(--lapis-soft)" stroke="none"/>
    <path d="${d}" fill="none" stroke="var(--lapis)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(vals.length - 1)}" cy="${y(vals[vals.length - 1])}" r="3.5" fill="var(--lapis)"/>`;
  return svg;
}
function plateauNote(key, ss) {
  if (ss.length < 6) return null;
  const vals = ss.slice(-6).map(s => key === 'digits' || key === 'forge' ? s.score : pct(s));
  const first = vals.slice(0, 3).reduce((a, b) => a + b) / 3, last = vals.slice(3).reduce((a, b) => a + b) / 3;
  const spread = Math.max(...vals) - Math.min(...vals), scale = Math.max(...vals) || 1;
  if (last <= first * 1.03 && spread / scale < 0.15) return 'No improvement for six sessions. This is the “OK plateau”: the skill has gone on autopilot. Make it 10–20% harder (more items or less time) and note exactly which items you get wrong.';
  if (last > first * 1.03) return 'Still climbing. Keep the same difficulty until it feels easy, then raise it.';
  return null;
}

function resultBlock(score, max, extras, again, unit) {

    ...(extras || []),
    h('div', { class: 'row' }, h('button', { class: 'btn primary', onclick: again }, 'Go again'), h('a', { class: 'btn', href: '#log' }, 'Training log'), h('a', { class: 'btn ghost', href: '#home' }, 'Back to the palace')));

/* ============ 1 · picture recall ============ */
VIEWS.pictures = app => {
  app.append(gameHeader('pictures', 'Pictures flash by, about one a second. Then you see pairs and pick the one you saw. In the 1970s, people shown 10,000 pictures once still recognised over 80% of them.'));
  const body = h('div', { class: 'panel tablet' }); app.append(body);
  let count = 30, speed = 1000;
  function setup() {
    body.innerHTML = '';
    body.append(h('div', { class: 'stack' },
      h('div', { class: 'optrow' },
        h('div', { class: 'f' }, 'Pictures', seg([[20, '20'], [30, '30'], [50, '50']], count, v => count = v)),
        h('div', { class: 'f' }, 'Time each', seg([[1500, '1.5 s'], [1000, '1 s'], [500, '0.5 s']], speed, v => speed = v))),
      tip('How to play', 'Don’t use any technique. Just look at each picture properly. Memory coaches use this test to show beginners that their memory for pictures is already excellent.'),
      h('div', {}, h('button', { class: 'btn primary', onclick: run }, 'Start'))));
  }
  function run() {
    const t0 = Date.now(); const pool = shuffle(EMOJI);
    const seen = pool.slice(0, count), unseen = pool.slice(count, count * 2);
    body.innerHTML = '';
    const stage = h('div', { class: 'pic-stage', 'aria-live': 'polite' }); const bar = h('i');
    body.append(h('div', { class: 'stack' }, h('div', { class: 'progress' }, bar), stage));
    let i = 0;
    const next = () => {
      if (i >= count) { stage.textContent = ''; later(() => test(seen, unseen, t0), 500); return; }
      stage.textContent = seen[i]; bar.style.width = ((i + 1) / count * 100) + '%'; i++;
      later(() => { stage.textContent = ''; later(next, 150); }, speed);
    };
    later(next, 400);
  }
  function test(seen, unseen, t0) {
    const order = shuffle(seen.map((s, i) => [s, unseen[i]]));
    let k = 0, right = 0; const missed = [];
    body.innerHTML = '';
    const lbl = h('p', { class: 'muted', style: 'text-align:center' }); const pair = h('div', { class: 'pair' });
    body.append(h('div', { class: 'stack' }, h('h2', { style: 'font-size:1.25rem;text-align:center' }, 'Which one did you see?'), lbl, pair));
    const show = () => {
      if (k >= order.length) return done();
      const [s, u] = order[k]; lbl.textContent = `${k + 1} of ${order.length}`; pair.innerHTML = '';
      shuffle([s, u]).forEach(o => pair.append(h('button', { type: 'button', onclick: () => { if (o === s) right++; else missed.push(s); k++; show(); } }, o)));
    };
    show();
    function done() {
      Store.record('pictures', right, order.length, { dur: Date.now() - t0, note: `${count} pictures · ${speed / 1000} s each` });
      body.innerHTML = '';
      body.append(resultBlock(right, order.length, [
        h('p', {}, right / order.length >= 0.85 ? 'Your visual memory is doing what it was built for, with no technique at all. Every other room borrows this power.' : 'Most people score above 85% after some practice. Try again at a slower pace and really look at each picture.'),
        missed.length ? h('p', { class: 'small muted' }, 'Missed: ', h('span', { style: 'font-size:1.4rem' }, missed.join(' '))) : null,
        tip('Why it matters', 'Pictures stick and words don’t. Every technique in the other rooms works by turning words, numbers and names into pictures, so they stick too.')], setup));
    }
  }
  setup();
};

/* ============ 2 · digit span ============ */
VIEWS.digits = app => {
  app.append(gameHeader('digits', 'Most people can hold about seven digits, give or take two. Joshua Foer, the book’s author, started at 9 and reached 18 after a year of training.'));
  const body = h('div', { class: 'panel tablet' }); app.append(body);
  let speed = 1000, grouping = 1, startLen = 5;
  function setup() {
    body.innerHTML = '';
    body.append(h('div', { class: 'stack' },
      h('div', { class: 'optrow' },
        h('div', { class: 'f' }, 'Pace', seg([[1000, '1 per second'], [700, 'Faster'], [450, 'Fastest']], speed, v => speed = v)),
        h('div', { class: 'f' }, 'Show digits', seg([[1, 'One at a time'], [3, 'In threes']], grouping, v => grouping = v)),
        h('div', { class: 'f' }, 'Start at', seg([[4, '4'], [5, '5'], [7, '7'], [10, '10']], startLen, v => startLen = v))),
      tip('How to beat seven', 'Don’t just repeat the digits in your head. Group them into chunks that mean something: read 1-9-4-5 as a year, or 3-4-9 as 3 minutes 49, a fast mile. Later, the Major System (Room 5) lets you turn each pair of digits into a picture.'),
      h('div', {}, h('button', { class: 'btn primary', onclick: () => run(startLen) }, 'Start test'))));
  }
  function run(len0) {
    const t0 = Date.now(); let len = len0, fails = 0, best = len0 - 1;
    const trial = () => {
      const num = Array.from({ length: len }, () => rand(10)).join('');
      body.innerHTML = '';
      const show = h('div', { class: 'digit-show', 'aria-live': 'polite' });
      body.append(h('div', { class: 'stack' }, h('p', { class: 'muted', style: 'text-align:center' }, `${len} digits`), show));
      const chunks = num.match(new RegExp(`.{1,${grouping}}`, 'g'));
      let i = 0;
      const step = () => {
        if (i >= chunks.length) { show.textContent = ''; later(() => ask(num), 300); return; }
        show.textContent = chunks[i++];
        later(() => { show.textContent = ''; later(step, 120); }, speed * (grouping === 3 ? 2.2 : 1));
      };
      later(step, 600);
    };
    const ask = num => {
      body.innerHTML = '';
      const inp = h('input', { type: 'text', inputmode: 'numeric', autocomplete: 'off', class: 'big-input', id: 'digit-answer', 'aria-label': 'Digits in order' });
      const go = () => {
        const ok = inp.value.replace(/\D/g, '') === num;
        if (ok) { best = Math.max(best, len); len++; fails = 0; } else { fails++; }
        body.innerHTML = '';
        const msg = h('div', { class: 'stack', style: 'text-align:center;align-items:center' },
          h('p', { class: ok ? 'ok' : 'no', style: 'font-size:1.2rem;font-weight:600' }, ok ? 'Correct' : 'Not quite'),
          h('p', { class: 'mono', style: 'font-size:1.3rem' }, num.replace(/(\d{3})(?=\d)/g, '$1 ')),
          !ok ? h('p', { class: 'mono muted' }, 'You typed: ' + (inp.value || '—')) : null);
        body.append(msg);
        if (fails >= 2) {
          later(() => {
            const sc = Math.max(0, best);
            Store.record('digits', sc, 0, { dur: Date.now() - t0, note: grouping === 3 ? 'shown in threes' : `${speed} ms per digit` });
            body.innerHTML = '';
            body.append(resultBlock(sc, 0, [
              h('p', {}, sc >= 10 ? 'Beyond the magical seven. You are storing chunks, not single digits.' : sc >= 7 ? 'Right in the human average of 7 ± 2. Chunking or Major-system images will push you past it.' : 'A short span is normal under pressure. Try “In threes” and read each group as one number.'),
              tip('A famous experiment', 'In 1981, a student known as SF practised this test for 250 hours. He was a runner, so he started reading the digits as race times, and his span went from 7 to about 80. His span for letters stayed at 7: memory skills only improve for what you actually train.')], setup, 'digits (your span)'));
          }, 1400);
        } else later(trial, 1400);
      };
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
      body.append(h('div', { class: 'stack', style: 'max-width:460px;margin:0 auto' }, h('label', { class: 'f', for: 'digit-answer' }, 'Type the digits in order'), inp, h('button', { class: 'btn primary', onclick: go }, 'Check')));
      inp.focus();
    };
    trial();
  }
  setup();
};

      h('div', { class: 'stage' }, locus, item, idea, nextBtn), h('p', { class: 'small muted', style: 'text-align:center' }, 'Enter or → for the next stop')));

  function recall(items, loci, msStudy, t0) {
    runCleanups();
    body.innerHTML = '';
    const order = loci.map((l, i) => i); if (dir === 'back') order.reverse();
    const inputs = [];
    const grid = h('div', { class: 'recall-grid' }, order.map(i => {

      grid, h('div', { class: 'row' }, check)));

    let done = false;
    function score() {
      if (done) return; done = true;
      let right = 0;
      items.forEach((it, i) => {
        const ok = matches(inputs[i].value, it) || norm(inputs[i].value).length > 3 && norm(it).includes(norm(inputs[i].value));
        if (ok) right++;
        inputs[i].classList.add(ok ? 'input-ok' : 'input-no'); inputs[i].readOnly = true;

      });
      check.remove();
      Store.record('palace', right, items.length, { dur: Date.now() - t0, ms: msStudy, note: `${{ errands: 'errands', words: 'words', hard: 'words + abstract' }[kind]} · ${dir === 'back' ? 'backwards' : 'forwards'}` });
      body.append(h('div', { class: 'panel' }, resultBlock(right, items.length, [

        tip('Make it last', 'More than half of anything new is forgotten within an hour unless you review it. Walk this route in your mind again this evening and tomorrow, and the list will stay with you.')], setup)));
    }
  }
  setup();

const firstLetters = line => line.replace(/([A-Za-z])[A-Za-z'’]*/g, '$1');
VIEWS.poem = app => {
  app.append(gameHeader('poem', 'Competitors dread this event most: every word, capital letter and comma must be right. Here you get partial credit for each correct word.'));
  const body = h('div', { class: 'stack' }); app.append(body);
  let poemId = POEMS[0].id, custom = '';
  const notes = {};
  const current = () => poemId === 'custom' ? { id: 'custom', title: 'Your text', by: '', text: custom } : POEMS.find(p => p.id === poemId);
  function setup() {
    body.innerHTML = '';
    const ta = h('textarea', { id: 'poem-custom', rows: 6, placeholder: 'Paste a poem, speech or passage. One line per line.', hidden: poemId !== 'custom' }, custom);
    ta.addEventListener('input', () => custom = ta.value);
    body.append(h('div', { class: 'panel tablet stack' },
      h('div', { class: 'f' }, 'Choose a text', seg([...POEMS.map(p => [p.id, p.title.replace(/[“”"]/g, '')]), ['custom', 'Your own']], poemId, v => { poemId = v; ta.hidden = v !== 'custom'; })),
      ta,
      tip('Two ways in', 'The picture way, from an ancient Roman memory textbook: say a line two or three times, then turn it into pictures and place them at a stop. The feeling way, used by a 15-year-old who won the poem event at the 2006 World Championship: split the poem into short chunks and feel what the writer feels in each, the way actors learn lines.'),
      h('div', { class: 'row' }, h('button', { class: 'btn primary', onclick: () => { if (!current().text.trim()) return; encode(); } }, 'Encode it'), h('button', { class: 'btn', onclick: () => { if (!current().text.trim()) return; test(); } }, 'Skip to the test'))));
  }
  const lines = () => current().text.split('\n').map(s => s.trimEnd()).filter(s => s.trim());
  function encode() {
    body.innerHTML = ''; const ls = lines(); const loci = getLoci(); const P = current();
    notes[P.id] = notes[P.id] || [];
    let cues = false;
    const list = h('div', {});
    const draw = () => {
      list.innerHTML = '';
      ls.forEach((l, i) => {
        const inp = h('input', { type: 'text', id: `note-${i}`, placeholder: `Image or feeling${loci[i] ? ' at ' + loci[i] : ''}`, value: notes[P.id][i] || '', 'aria-label': `Image for line ${i + 1}` });
        inp.addEventListener('input', () => notes[P.id][i] = inp.value);
        list.append(h('div', { class: 'poem-line' }, h('span', { class: 'n' }, i + 1), h('div', { class: 'stack', style: 'gap:6px' }, h('div', { class: 'txt' }, cues ? firstLetters(l) : l), inp)));
      });
    };
    draw();
    body.append(h('div', { class: 'panel tablet stack' },
      h('div', { class: 'row' }, h('div', {}, h('h2', { style: 'font-size:1.2rem' }, P.title), P.by ? h('p', { class: 'small muted' }, P.by) : null), h('span', { class: 'spacer' }),
        seg([[false, 'Full text'], [true, 'First letters only']], cues, v => { cues = v; draw(); })),
      h('p', { class: 'small muted' }, 'For each line, jot the picture or feeling you are placing at that stop. Words that are hard to picture? Use sound-alikes. One German champion keeps a fixed picture for small words, like a circle for “and”, and imagines hammering a nail at each full stop. Then switch to first letters and recite until you can.'),
      list,
      h('div', { class: 'row' }, h('button', { class: 'btn primary', onclick: test }, 'I’m ready for the test'), h('button', { class: 'btn ghost', onclick: setup }, 'Choose another text'))));
  }
  function test() {
    body.innerHTML = ''; const ls = lines(); const P = current(); const t0 = Date.now();
    const ins = ls.map((l, i) => h('input', { type: 'text', id: `line-${i}`, autocomplete: 'off', spellcheck: 'false', 'aria-label': `Line ${i + 1}` }));
    const res = ls.map(() => h('div', { class: 'small diff' }));
    ins.forEach((inp, i) => inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); (ins[i + 1] || checkBtn).focus(); } }));
    const checkBtn = h('button', { class: 'btn primary', onclick: () => score() }, 'Check my poem');
    body.append(h('div', { class: 'panel tablet stack' }, h('h2', { style: 'font-size:1.2rem' }, `${P.title}: from memory`),
      h('p', { class: 'small muted' }, `${ls.length} lines. Walk your stops. Capitals and punctuation count for a perfect line, as in competition.`),
      h('div', {}, ls.map((l, i) => h('div', { class: 'poem-line' }, h('span', { class: 'n' }, i + 1), h('div', { class: 'stack', style: 'gap:4px' }, ins[i], res[i])))),
      h('div', { class: 'row' }, checkBtn)));
    ins[0].focus();
    let done = false;
    function score() {
      if (done) return; done = true;
      let words = 0, total = 0, perfect = 0;
      ls.forEach((l, i) => {
        const a = wordsOf(l), g = wordsOf(ins[i].value); const c = lcs(a, g);
        words += c; total += a.length;
        const exact = ins[i].value.trim().replace(/\s+/g, ' ') === l.trim().replace(/\s+/g, ' ');
        if (exact) perfect++;
        { const cls = exact ? 'input-ok' : (c === a.length && g.length === a.length ? '' : 'input-no'); if (cls) ins[i].classList.add(cls); } ins[i].readOnly = true;
        if (!exact) res[i].append(h('span', { class: 'muted' }, c === a.length && g.length === a.length ? 'Words right, check punctuation: ' : 'Original: '), h('span', {}, l));
      });
      checkBtn.remove();
      Store.record('poem', words, total, { dur: Date.now() - t0, note: `${P.title.replace(/[“”"]/g, '')} · ${perfect}/${ls.length} perfect lines` });
      body.append(h('div', { class: 'panel' }, resultBlock(words, total, [h('p', {}, `${perfect} of ${ls.length} lines perfect, punctuation included.`),
        tip('Make it last', 'Recite it again tomorrow before looking at the text, and again in a week. The author’s coach learned most of Milton’s Paradise Lost this way, at about 200 lines an hour.')], setup, 'of ' + total + ' words')));
    }
  }
  setup();
};

/* ============ 9 · image forge ============ */
VIEWS.forge = app => {
  app.append(gameHeader('forge', 'Memory champions say their sport is really a test of creativity: how fast you can invent a picture that sticks.'));
  const body = h('div', { class: 'panel tablet stack' }); app.append(body);
  let deck = shuffle(FORGE), k = 0, made = 0, checksTotal = 0; const t0 = Date.now();
  function card() {
    body.innerHTML = '';
    if (k >= deck.length) { deck = shuffle(FORGE); k = 0; }
    const [prompt, example] = deck[k];
    const ta = h('textarea', { id: 'forge-in', rows: 3, placeholder: 'Describe the scene you see. Where is it? What is happening? What does it smell like?', 'aria-label': 'Your image' });
    const boxes = FORGE_CHECKS.map(([id, label]) => { const c = h('input', { type: 'checkbox', id: 'chk-' + id }); return [c, h('label', { for: 'chk-' + id }, c, h('span', {}, label))]; });
    const reveal = h('div', { class: 'stack', hidden: true });
    const rate = h('button', { class: 'btn primary', onclick: () => {
      if (!ta.value.trim()) { ta.focus(); return; }
      const n = boxes.filter(([c]) => c.checked).length; made++; checksTotal += n;
      rate.disabled = true; boxes.forEach(([c]) => c.disabled = true); ta.readOnly = true;
      reveal.hidden = false;
      reveal.append(h('p', {}, h('b', {}, `${n} of 6 qualities. `), n >= 5 ? 'That one will stick.' : n >= 3 ? 'Decent. Which missing quality could you add in two seconds?' : 'Too tame. Make it bigger, ruder, louder, smellier.'),
        tip('One way to see it', example),
        h('p', { class: 'small muted' }, 'Like Benjamin Franklin rebuilding an essay and comparing it to the original: compare, notice what the example does that yours does not, and steal it.'),
        h('div', { class: 'row' }, h('button', { class: 'btn primary', onclick: () => { k++; card(); } }, 'Next prompt'), h('button', { class: 'btn', onclick: finish }, `Finish session (${made} made)`)));
    } }, 'Rate my image');
    body.append(
      h('div', { class: 'row' }, h('span', { class: 'small muted' }, `Image ${made + 1}`), h('span', { class: 'spacer' }), made ? h('button', { class: 'btn small ghost', onclick: finish }, 'Finish session') : null),
      h('div', { class: 'stage', style: 'min-height:120px;padding:10px' }, h('span', { class: 'locus' }, 'Make this memorable'), h('div', { class: 'item-big' }, prompt)),
      ta, h('div', { class: 'checks' }, boxes.map(b => b[1])), h('div', {}, rate), reveal);
    ta.focus();
  }
  function finish() {
    if (!made) return;
    Store.record('forge', made, 0, { dur: Date.now() - t0, note: `average ${(checksTotal / made).toFixed(1)} of 6 qualities` });
    body.innerHTML = '';
    body.append(resultBlock(made, 0, [h('p', {}, `Average ${(checksTotal / made).toFixed(1)} of 6 qualities per image.`),
      tip('The oldest advice', 'A Roman memory textbook from about 85 BC says it best: we forget ordinary things, because nothing new stirs the mind, but remember things that are shocking, unusual, great, unbelievable or funny for a long time.')],
      () => { made = 0; checksTotal = 0; card(); }, 'images forged'));
  }
  card();
};

/* ============ boot ============ */
function start() {
  Store.loadLocal(); setSync();
  window.addEventListener('hashchange', route);
  route();
  Store.connect();
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start();
</script>
